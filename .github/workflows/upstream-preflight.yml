name: Pinned upstream merge preflight
on:
  push:
    branches: [codex/upstream-preflight-20261007]
permissions:
  contents: read
concurrency:
  group: upstream-preflight-20261007
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact fork and upstream commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-preflight"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --no-tags upstream a4331b8d745971fdc1be33bba5513ab16105e2d3
          git update-ref refs/heads/preflight-upstream a4331b8d745971fdc1be33bba5513ab16105e2d3
          git checkout --detach b7eb313f92587b92c417ef02a6c3a80b6aaf738a
          git bundle create "$RUNNER_TEMP/upstream-preflight/source.bundle" --all
          set +e
          git merge --no-commit --no-ff a4331b8d745971fdc1be33bba5513ab16105e2d3 >"$RUNNER_TEMP/upstream-preflight/merge.log" 2>&1
          merge_rc=$?
          set -e
          cat "$RUNNER_TEMP/upstream-preflight/merge.log"
          test "$merge_rc" -le 1
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/upstream-preflight/conflicts.txt"
          git diff --cc >"$RUNNER_TEMP/upstream-preflight/conflicts.diff"
          git status --short >"$RUNNER_TEMP/upstream-preflight/status.txt"
          printf 'Merge exit: %s\n' "$merge_rc" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/upstream-preflight/conflicts.txt" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload public source and conflict evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-preflight
          path: ${{ runner.temp }}/upstream-preflight/*
          retention-days: 3
          if-no-files-found: error
