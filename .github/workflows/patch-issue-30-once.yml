name: Patch issue 30 once

on:
  push:
    branches:
      - agent/patch-issue-30-runner

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-30-wireguard-reserved-length
          fetch-depth: 0
      - name: Apply minimal diagnostic fix
        shell: bash
        run: |
          set -euo pipefail
          file=transport/wireguard/endpoint.go
          old='return nil, E.New("invalid reserved value for peer ", peerIndex, ", required 3 bytes, got ", len(peer.reserved))'
          new='return nil, E.New("invalid reserved value for peer ", peerIndex, ", required 3 bytes, got ", len(rawPeer.Reserved))'
          grep -F "$old" "$file"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("transport/wireguard/endpoint.go")
          s = p.read_text()
          old = 'return nil, E.New("invalid reserved value for peer ", peerIndex, ", required 3 bytes, got ", len(peer.reserved))'
          new = 'return nil, E.New("invalid reserved value for peer ", peerIndex, ", required 3 bytes, got ", len(rawPeer.Reserved))'
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one target line, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --numstat | wc -l)" -eq 1
          git diff --exit-code -- . ':(exclude)transport/wireguard/endpoint.go' || exit 1
          git diff -- transport/wireguard/endpoint.go
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport/wireguard/endpoint.go
          git commit -m "fix(wireguard): report actual reserved length"
          git push origin HEAD:agent/issue-30-wireguard-reserved-length
