name: Verify PR 558 once

on:
  push:
    branches:
      - agent/verify-pr-558

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: agent/issue-30-wireguard-reserved-length
          fetch-depth: 1
      - name: Checkout WireGuard submodule
        run: git submodule update --init --depth 1 -- submodules/wireguard-go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26'
      - name: Test WireGuard package
        run: go test ./transport/wireguard
