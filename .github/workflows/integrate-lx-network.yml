name: Integrate sing-box-lx network features

on:
  workflow_dispatch:
  push:
    branches:
      - integrate/network-20260914
    paths:
      - .github/workflows/integrate-lx-network.yml
      - scripts/integrate-lx-network.sh
      - common/interrupt/**
      - protocol/wireguard/ondemand_compat_magicnet.go
      - transport/wireguard/ondemand_compat_magicnet.go

permissions:
  contents: write

concurrency:
  group: integrate-lx-network-v3
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/network-20260914
          fetch-depth: 0
          submodules: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate thin-fork feature tree
        run: bash scripts/integrate-lx-network.sh

      - name: Initialize AWG runtime submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive submodules/wireguard-go

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Preserve current network dependencies
        run: |
          go mod edit -dropreplace=github.com/sagernet/sing-tun || true
          go mod edit -dropreplace=github.com/sagernet/gvisor || true
          go mod edit -require=github.com/sagernet/sing-tun@v0.9.2-0.20260909144315-8e1fb85d5b15
          go mod edit -require=github.com/sagernet/gvisor@v0.0.0-20260727.0-sing-box-mod.1
          go mod tidy
          git add go.mod go.sum

      - name: Build Linux and Android arm64
        run: |
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          CGO_ENABLED=0 go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0" ./cmd/sing-box
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0" ./cmd/sing-box

      - name: Test integrated network packages
        shell: bash
        run: |
          set -euo pipefail
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          for p in ./common/interrupt ./transport/v2rayxhttp ./transport/masque ./protocol/wireguard ./protocol/group ./dns/transport/group ./protocol/chain; do
            [ -d "${p#./}" ] || continue
            echo "::group::$p"
            timeout 150s env CGO_ENABLED=0 go test -count=1 -timeout=120s -tags "$TAGS" "$p"
            echo "::endgroup::"
          done

      - name: Commit verified integration
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: integrate sing-box-lx network capabilities"
          git push origin HEAD:integrate/network-20260914
