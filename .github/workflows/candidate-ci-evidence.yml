name: Candidate CI evidence
on:
  push:
    branches: [codex/upstream-preflight-20261007]
    paths: [.github/workflows/candidate-ci-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download existing candidate logs without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          for run in 37531717617 37531716816; do
            gh api "repos/LIghtJUNction/sing-box/actions/runs/$run/jobs" > "$RUNNER_TEMP/evidence/$run-jobs.json"
            jq -r '.jobs[] | select(.conclusion == "failure") | .id' "$RUNNER_TEMP/evidence/$run-jobs.json" | while read -r job; do
              gh api "repos/LIghtJUNction/sing-box/actions/jobs/$job/logs" > "$RUNNER_TEMP/evidence/$job.log"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-ci-evidence
          path: ${{ runner.temp }}/evidence/*
          retention-days: 3
          if-no-files-found: error
