name: Verify candidate runtime repairs
on:
  push:
    branches: [codex/upstream-preflight-20261007]
    paths: [.github/workflows/candidate-runtime-fixes.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26'
      - name: Reproduce exact repairs and execute affected packages
        shell: bash
        run: |
          set -euo pipefail
          cp .github/maintenance/fix-candidate-runtime.py "$RUNNER_TEMP/fix-candidate-runtime.py"
          mkdir -p "$RUNNER_TEMP/runtime-evidence"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git ls-remote origin refs/heads/codex/upstream-runtime-fixes-20261007)"
          git checkout --detach c5a4f4dc186165f9cd8ae2ee19dd8a8863bed494
          python "$RUNNER_TEMP/fix-candidate-runtime.py"
          git add transport/v2ray/transport.go protocol/vless/lx_encryption.go protocol/vless/lx_encryption_cancel_test.go protocol/group/urltest.go protocol/group/urltest_owner_cancel_test.go
          git diff --cached --check
          test "$(git write-tree)" = 813049c2b04faa84d9960ce844e751f891bc2b89
          git write-tree > "$RUNNER_TEMP/runtime-evidence/tree.txt"
          go version > "$RUNNER_TEMP/runtime-evidence/go-version.txt"
          set +e
          go test -count=2 -v -exec sudo -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" -ldflags "$(cat release/LDFLAGS)" ./transport/v2ray ./protocol/vless ./protocol/group ./lx-test/zombie ./transport/v2rayxhttp > "$RUNNER_TEMP/runtime-evidence/tests.log" 2>&1
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/runtime-evidence/exit-code.txt"
          tail -100 "$RUNNER_TEMP/runtime-evidence/tests.log"
          test "$result" = 0
          git commit -m 'fix: cancel owned URL tests and VLESS handshakes; normalize transport failures'
          git push origin HEAD:refs/heads/codex/upstream-runtime-fixes-20261007
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-repair-evidence
          path: ${{ runner.temp }}/runtime-evidence/*
          retention-days: 3
          if-no-files-found: error
