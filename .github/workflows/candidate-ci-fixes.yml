name: Prepare candidate CI repairs
on:
  push:
    branches: [codex/upstream-preflight-20261007]
    paths: [.github/workflows/candidate-ci-fixes.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26'
      - name: Apply reviewed source changes and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/maintenance/fix-candidate-ci.py "$RUNNER_TEMP/fix-candidate-ci.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git ls-remote origin refs/heads/codex/upstream-ci-fixes-20261007)"
          git checkout --detach fd34958b2daf9b6a8898414a2ed29ccc6ffd58fe
          python "$RUNNER_TEMP/fix-candidate-ci.py"
          git add .golangci.yml adapter common dns experimental protocol transport
          git diff --cached --check
          test "$(git write-tree)" = c62b7c5d6148d08a53554358b8c882c343274825
          git diff --cached --stat
          git commit -m 'fix(ci): retain fork features and repair candidate lint regressions'
          git push origin HEAD:refs/heads/codex/upstream-ci-fixes-20261007
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
