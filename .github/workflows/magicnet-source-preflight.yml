name: MagicNet source preflight
on:
  push:
    branches: [codex/upstream-preflight-20261007]
    paths: [.github/workflows/magicnet-source-preflight.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot public integration sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magicnet-preflight"
          git clone --no-checkout https://github.com/LIghtJUNction/MagicNet.git "$RUNNER_TEMP/MagicNet"
          cd "$RUNNER_TEMP/MagicNet"
          git fetch origin 939e34c87736ccd93c1eaa5d9baf916adfa96e36 259a7624c7e74e2ec7c3a942e5ca3b97c2962628
          git update-ref refs/heads/preflight-367 939e34c87736ccd93c1eaa5d9baf916adfa96e36
          git update-ref refs/heads/preflight-368 259a7624c7e74e2ec7c3a942e5ca3b97c2962628
          git checkout --detach 259a7624c7e74e2ec7c3a942e5ca3b97c2962628
          git submodule update --init src/MagicNet/lib/kamfw .kam/bases/hooks .kam/bases/workflows src/MagicNet/.config/sing-box
          git bundle create "$RUNNER_TEMP/magicnet-preflight/MagicNet.bundle" --all
          tar --exclude='.git' -czf "$RUNNER_TEMP/magicnet-preflight/dependencies.tar.gz" src/MagicNet/lib/kamfw .kam/bases/hooks .kam/bases/workflows src/MagicNet/.config/sing-box
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: magicnet-preflight
          path: ${{ runner.temp }}/magicnet-preflight/*
          retention-days: 3
          if-no-files-found: error
